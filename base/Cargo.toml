[workspace]
members = ["crates/domain", "crates/application", "crates/sqlite", "crates/bindings", "crates/native", "crates/service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
