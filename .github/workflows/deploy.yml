name: Check and deploy book server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shufang-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Test deployment supervisor
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Install application dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: app
        run: npm run check
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Test
        working-directory: app
        run: npm test
      - name: Build
        working-directory: app
        run: npm run build
      - name: Deploy exact commit and wait for health checks
        env:
          DEPLOY_TOKEN: ${{ secrets.SHUFANG_DEPLOY_TOKEN }}
        run: python3 deploy/trigger.py
