<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob:; connect-src 'self' https://resource.shufang.local; worker-src 'self' blob:">
<link rel="stylesheet" href="reader.css"></head><body>
<header><select id="chapters" aria-label="章节"></select><button id="previous">上一章</button><button id="next">下一章</button><label>字号<input id="size" type="range" min="14" max="40" value="20"></label><button id="theme">切换主题</button><button id="mode" hidden>原版 / 重排</button><label>行距<select id="spacing"><option>1.5</option><option selected>1.9</option><option>2.3</option></select></label><input id="find" type="search" placeholder="全书查找" aria-label="全书查找"></header>
<details id="outlinePanel"><summary>高级目录</summary><select id="outline" aria-label="目录条目"></select><input id="outlineTitle" placeholder="目录标题" aria-label="目录标题"><button data-outline-action="add">添加选中文段</button><button data-outline-action="rename">重命名</button><button data-outline-action="up">上移</button><button data-outline-action="down">下移</button><button data-outline-action="indent">缩进</button><button data-outline-action="outdent">提升</button><button data-outline-action="delete">删除自定义条目</button></details>
<main id="content"></main><script type="module" src="reader.js"></script></body></html>
