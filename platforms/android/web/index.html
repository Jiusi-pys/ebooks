<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'">
<link rel="stylesheet" href="pdf_viewer.css"><style>
@font-face{font-family:ShufangSong;src:url(fonts/NotoSerifCJKsc-Regular.otf)}@font-face{font-family:ShufangKai;src:url(fonts/LXGWWenKaiLite-Regular.ttf)}@font-face{font-family:ShufangFangSong;src:url(fonts/tkFangSong.ttf)}@font-face{font-family:ShufangYuan;src:url(fonts/ZCOOLKuaiLe-Regular.ttf)}.footnote{background:none;color:inherit;min-width:48px;min-height:48px;padding:0}.footnote sup{font-size:.62em;vertical-align:super}.footnote-popup{position:fixed;z-index:30;right:16px;top:16px;width:min(420px,calc(100vw - 64px));max-height:60vh;overflow:auto;padding:16px;background:inherit;border:1px solid currentColor;border-radius:16px;box-shadow:0 8px 28px #0002}#status:empty{padding:0}body{overflow:hidden}:root{color-scheme:light dark}body{margin:0;background:#faf7f0;color:#252722;font-family:serif}#content{padding:20px 22px;line-height:1.9;font-size:19px;overflow-wrap:anywhere}p{margin:0 0 1em;white-space:pre-wrap}h2{font-size:1.3em}mark{background:#ffe59a;color:inherit}::selection{background:#b9d8b4}#status{padding:16px;color:#656b61;font:14px sans-serif}.pdf-page{position:relative;margin:auto;background:white}.pdf-page canvas{display:block;width:100%;height:100%}.textLayer{position:absolute;inset:0}.pdf-controls{display:flex;gap:20px;justify-content:center;padding:12px}button{padding:10px 18px;border-radius:12px;border:0;background:#e0e8da;color:#25382a}.translation{border-top:1px solid #ccc;margin-top:18px;color:#425c47}
/* Flat text-layer rules also support WebView 69, which predates :is() and CSS nesting. */
.textLayer{overflow:hidden;line-height:1;letter-spacing:normal;word-spacing:normal;transform-origin:0 0;-webkit-text-size-adjust:none;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0;-webkit-user-select:text;user-select:text}
.textLayer>span:not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;font-size:calc(var(--text-scale-factor) * var(--font-height));transform:rotate(var(--rotate,0deg)) scaleX(var(--scale-x,1)) scale(var(--min-font-size-inv,1))}
.textLayer .markedContent{display:contents}.textLayer span[role="img"]{-webkit-user-select:none;user-select:none}
</style></head><body><div id="status">正在打开文档…</div><main id="content"></main><script type="module" src="reader.js"></script></body></html>
